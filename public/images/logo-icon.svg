<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <!-- Yamaha Official Racing Red Gradient -->
    <linearGradient id="yamahaRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1A2A" />
      <stop offset="45%" stop-color="#E60012" />
      <stop offset="100%" stop-color="#B3000E" />
    </linearGradient>

    <!-- Chrome Rim Gradient -->
    <linearGradient id="chromeRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4" />
    </linearGradient>

    <!-- Deep Ambient Glow Filter -->
    <filter id="yamahaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#E60012" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Base Circular Plate with Glow -->
  <circle cx="60" cy="60" r="54" fill="url(#yamahaRed)" filter="url(#yamahaGlow)" />
  <circle cx="60" cy="60" r="54" stroke="url(#chromeRim)" stroke-width="2" />
  <circle cx="60" cy="60" r="51.5" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1" />

  <!-- Authentic Yamaha Motor 3-Tuning-Fork Emblem -->
