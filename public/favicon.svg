  <!-- Plate / Document Release Badge -->
  <g transform="translate(30, 29)">
    <rect width="28" height="20" rx="4" fill="#0B132B" stroke="#64748B" stroke-width="1.2" />
    <rect x="1" y="1" width="26" height="4" rx="2" fill="url(#favRed)" />
    <circle cx="5" cy="11" r="2" fill="#F59E0B" />
    <path d="M11 12 L14 15 L21 8" stroke="#10B981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
